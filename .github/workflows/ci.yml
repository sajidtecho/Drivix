name: Drivix CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Lint Machine Learning Subsystem
  # -------------------------------------------------------------
  ml-service-validation:
    name: ML Service Tests & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements-prod.txt

      - name: Verify Model Artifacts & Pipeline Integrity
        run: |
          python -c "
          import os, sys, joblib
          sys.path.append(os.path.join('ml_service', 'src'))
          from predict import get_inference_engine
          engine = get_inference_engine()
          assert engine.pipeline is not None, 'Model pipeline failed to load!'
          print('ML pipeline verified successfully.')
          quote = engine.predict_single({'f_location': 'Vanice Mall', 'f_capacity': 100, 'f_occ_entry_at_quote': 0.85}, base_hourly_rate=60)
          print('Sample prediction quote:', quote)
          assert quote['recommended_hourly_price'] > 0
          "

  # -------------------------------------------------------------
  # Job 2: Test & Build Node.js Backend
  # -------------------------------------------------------------
  backend-validation:
    name: Node.js Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WebApp/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: WebApp/backend
        run: npm ci

      - name: Validate Pricing Engine & Syntax
        working-directory: WebApp/backend
        run: |
          node -e "
          import('./utils/pricingEngine.js').then(async (m) => {
            const res = await m.calculateDynamicPrice({ basePrice: 60, totalSlots: 100, availableSlots: 20 });
            console.log('Pricing fallback verified:', res);
          });
          "

  # -------------------------------------------------------------
  # Job 3: Build React Vite Frontend
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WebApp/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: WebApp/frontend
        run: npm ci

      - name: Production Vite Build
        working-directory: WebApp/frontend
        run: npm run build

  # -------------------------------------------------------------
  # Job 4: Validate Docker Compose Configuration
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Compose Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Root Docker Compose Spec
        run: docker compose config

      - name: Validate WebApp Docker Compose Spec
        run: docker compose -f WebApp/docker-compose.yml config
