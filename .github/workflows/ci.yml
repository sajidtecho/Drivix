name: Drivix CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Pytest Suite for Machine Learning Subsystem
  # -------------------------------------------------------------
  ml-service-tests:
    name: ML Service Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies & Test Runner
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_service/requirements-prod.txt
          pip install pytest httpx

      - name: Execute Pytest Suite (Unit, Pipeline, & API Tests)
        run: pytest ml_service/tests -v

  # -------------------------------------------------------------
  # Job 2: Jest Test Suite for Node.js Backend
  # -------------------------------------------------------------
  backend-tests:
    name: Node.js Backend Jest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WebApp/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: WebApp/backend
        run: npm ci

      - name: Execute Pricing Engine Unit & Fallback Tests
        working-directory: WebApp/backend
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js __tests__/pricing.test.js --forceExit

  # -------------------------------------------------------------
  # Job 3: Build React Vite Frontend
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WebApp/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: WebApp/frontend
        run: npm ci

      - name: Production Vite Build
        working-directory: WebApp/frontend
        run: npm run build

  # -------------------------------------------------------------
  # Job 4: Validate Docker Compose Configuration
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Compose Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Root Docker Compose Spec
        run: docker compose config

      - name: Validate WebApp Docker Compose Spec
        run: docker compose -f WebApp/docker-compose.yml config
