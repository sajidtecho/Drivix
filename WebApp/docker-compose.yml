name: drivix-app

services:
  # Node.js + Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drivix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - drivix-network

  # React Vite Frontend SPA + Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drivix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - drivix-network

# Optional Local MongoDB container (Uncomment if you want local DB instead of Atlas cloud)
